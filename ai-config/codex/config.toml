# Project trust, generated state, cache paths, and application-specific absolute
# paths are intentionally excluded because they are local to each environment.
model = "gpt-5.6-sol"
model_reasoning_effort = "medium"
service_tier = "default"

[plugins."google-calendar@openai-curated"]
enabled = true

[plugins."gmail@openai-curated"]
enabled = true

[plugins."github@openai-curated"]
enabled = true

[plugins."google-drive@openai-curated"]
enabled = true

[plugins."notion@openai-curated"]
enabled = true

[plugins."atlassian-rovo@openai-curated"]
enabled = true

[plugins."slack@openai-curated"]
enabled = true

[plugins."sites@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."chrome-devtools-mcp@claude-plugins-official"]
enabled = true

[plugins."context7@claude-plugins-official"]
enabled = true

[plugins."playwright@claude-plugins-official"]
enabled = true

[plugins."rust-analyzer-lsp@claude-plugins-official"]
enabled = true

[plugins."serena@claude-plugins-official"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[tui]
status_line = [
    "model-with-reasoning",
    "current-dir",
    "git-branch",
    "context-usage",
    "five-hour-limit",
    "weekly-limit",
    "context-window-size",
    "used-tokens",
    "total-input-tokens",
    "total-output-tokens",
]

[marketplaces.claude-plugins-official]
source_type = "git"
source = "https://github.com/anthropics/claude-plugins-official.git"

[features]
hooks = true
js_repl = false

[mcp_servers.codex]
command = "codex"
args = ["mcp-server"]

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
enabled = false

[mcp_servers.newrelic]
url = "https://mcp.newrelic.com/mcp/"

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[shell_environment_policy]
inherit = "core"
