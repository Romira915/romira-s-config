# Project trust, generated state, cache paths, and application-specific absolute
# paths are intentionally excluded because they are local to each environment.
approvals_reviewer = "user"

[plugins."google-calendar@openai-curated"]
enabled = true

[plugins."gmail@openai-curated"]
enabled = true

[plugins."github@openai-curated"]
enabled = true

[plugins."google-drive@openai-curated"]
enabled = true

[plugins."notion@openai-curated"]
enabled = true

[plugins."atlassian-rovo@openai-curated"]
enabled = true

[plugins."slack@openai-curated"]
enabled = true

[plugins."sites@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."chrome-devtools-mcp@claude-plugins-official"]
enabled = true

[plugins."chrome-devtools-mcp@claude-plugins-official".mcp_servers.chrome-devtools.tools.new_page]
approval_mode = "approve"

[plugins."context7@claude-plugins-official"]
enabled = true

[plugins."playwright@claude-plugins-official"]
enabled = true

[plugins."playwright@claude-plugins-official".mcp_servers.playwright.tools.browser_tabs]
approval_mode = "approve"

[plugins."playwright@claude-plugins-official".mcp_servers.playwright.tools.browser_navigate]
approval_mode = "approve"

[plugins."rust-analyzer-lsp@claude-plugins-official"]
enabled = true

[plugins."serena@claude-plugins-official"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."chrome@openai-bundled"]
enabled = true

[plugins."codex-app-tools@openai-bundled"]
enabled = true

[tui]
status_line = [
    "model-with-reasoning",
    "current-dir",
    "git-branch",
    "context-usage",
    "five-hour-limit",
    "weekly-limit",
    "context-window-size",
    "used-tokens",
    "total-input-tokens",
    "total-output-tokens",
]

[marketplaces.claude-plugins-official]
source_type = "git"
source = "https://github.com/anthropics/claude-plugins-official.git"

[features]
hooks = true
js_repl = false

[mcp_servers.codex]
command = "codex"
args = ["mcp-server"]

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
enabled = false

[mcp_servers.newrelic]
url = "https://mcp.newrelic.com/mcp/"

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[mcp_servers.google_maps]
command = "npx"
args = ["-y", "@cablate/mcp-google-map", "--stdio"]
env_vars = ["GOOGLE_MAPS_API_KEY"]
startup_timeout_sec = 30

[shell_environment_policy]
inherit = "core"

[apps.connector_947e0d954944416db111db556030eea6]
enabled = false
